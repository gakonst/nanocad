name: Native and CAD validation
on:
  push:
  pull_request:
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Tools/requirements.txt
      - run: pip install -r Tools/requirements.txt
      - run: python Tools/test_export_step.py
      - run: cmp Tools/export_step.py Resources/export_step.py
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Select an available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS-26" in k for v in vs if "iPhone" in v["name"]))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - run: xcodebuild -project NanoCAD.xcodeproj -scheme NanoCAD -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath TestResults.xcresult test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Simulator-tests
          path: TestResults.xcresult
